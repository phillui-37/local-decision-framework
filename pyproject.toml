[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="local-decision-framework"
description="Local-first, evidence-grounded claim checks over MCP and CLI"
readme="README.md"
version="0.2.2"
requires-python=">=3.10"
dependencies=["mcp>=1.30,<2"]
[project.scripts]
ldf="jev.cli:main"
ldf-mcp="jev.mcp_server:main"
jev="jev.cli:main"
jev-mcp="jev.mcp_server:main"
[tool.setuptools.packages.find]
where=["src"]
