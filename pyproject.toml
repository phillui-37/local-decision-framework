[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="local-decision-framework"
description="Local-first, evidence-grounded claim checks over MCP and CLI"
readme="README.md"
version="0.3.0"
requires-python=">=3.10"
dependencies=["mcp>=1.30,<2"]
[project.scripts]
ldf="ldf.cli:main"
ldf-mcp="ldf.mcp_server:main"
# Legacy aliases for existing integrations; identical entry points.
jev="ldf.cli:main"
jev-mcp="ldf.mcp_server:main"
[tool.setuptools.packages.find]
where=["src"]
